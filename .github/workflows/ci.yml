name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies cleanly from lockfile
        run: npm ci

      - name: Lint & boundary checks
        run: npm run lint

      - name: Install Chromium for worker CLI & Playwright
        run: npx playwright install --with-deps chromium

      - name: Run worker tests (includes @excalidraw/cli renders)
        env:
          EXCALIDRAW_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          CHROME_BIN=$(command -v chromium || command -v chromium-browser || command -v google-chrome || find ~/.cache/ms-playwright -name chrome -type f | head -n 1)
          EXCALIDRAW_BROWSER_PATH="$CHROME_BIN" npm run test:worker

      - name: Run Express API tests
        run: npm run test:api

      - name: Run PGlite Postgres SQL/RLS migration tests
        run: npm run test:rls:sql

      - name: Run Frontend unit & CSP hash verification tests
        run: npm run test:frontend

      - name: Build Frontend production bundle (no source maps)
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key_value
          VITE_API_BASE_URL: https://api.ci-placeholder.invalid
        run: npm run build:frontend

      - name: Verify zero source maps and zero secret strings in frontend/dist
        run: |
          if find frontend/dist -name '*.map' | grep -q .; then
            echo "ERROR: Source maps found in frontend/dist!"
            exit 1
          fi
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|GEMINI_API_KEY|REDIS_URL" frontend/dist/; then
            echo "ERROR: Server secret reference found in frontend/dist!"
            exit 1
          fi

      - name: Run Playwright E2E + Axe WCAG 2 AA + Motion & Tablet checks
        run: npm run test:e2e

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build single multi-stage production image
        run: docker build -t visualify:ci .

      - name: Inspect image history & confirm zero baked .env files
        run: |
          docker history --no-trunc visualify:ci
          if docker run --rm --entrypoint sh visualify:ci -c "find /app -name '.env*' ! -name '.env.example' | grep -q ."; then
            echo "ERROR: Unmasked .env file baked into Docker image!"
            exit 1
          fi

      - name: Run worker Chromium PNG + SVG render smoke inside container
        run: docker run --rm visualify:ci node backend/worker/src/scripts/dockerSmoke.js

      - name: Smoke-test API role /healthz inside container with dummy non-secret env
        run: |
          CID=$(docker run -d -p 5000:5000 \
            -e NODE_ENV=production \
            -e PROCESS_ROLE=api \
            -e PORT=5000 \
            -e FRONTEND_ORIGIN=http://localhost:5173 \
            -e SUPABASE_URL=https://ci-placeholder.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder_key_value \
            -e SUPABASE_SERVICE_ROLE_KEY=ci_placeholder_service_role_not_a_live_secret \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            visualify:ci)
          trap "docker rm -f $CID" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/healthz; then
              echo "API healthz OK"
              exit 0
            fi
            sleep 1
          done
          docker logs "$CID"
          exit 1
